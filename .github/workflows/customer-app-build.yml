name: Grouppy customer app build
on:
  push:
    branches:
      - feature/customer-roundtrip-mobile-2026-11-05
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package*.json'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
